services:
  - type: web
    name: siteprobe-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install-deps chromium && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PORT
        value: "3001"
